<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memtrace Visualizer</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --read-color: #4ade80;
            --write-color: #f87171;
            --border: #334155;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem;
            min-height: 100vh; 
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        h1::before {
            content: '';
            display: block;
            width: 12px;
            height: 12px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background-color: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card h3 {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .visualization-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .legend {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        
        .read-color { background-color: var(--read-color); }
        .write-color { background-color: var(--write-color); }
        
        canvas {
            width: 100%;
            height: 400px;
            background-color: var(--bg-main);
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: crosshair;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            font-size: 0.875rem;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        
        .tooltip-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.25rem;
        }
        
        .tooltip-row:last-child {
            margin-bottom: 0;
        }
        
        .tooltip-label {
            color: var(--text-muted);
        }
        
        .tooltip-value {
            font-family: monospace;
            font-weight: 600;
        }
        
        #error-message {
            display: none;
            background-color: rgba(248, 113, 113, 0.1);
            border: 1px solid var(--write-color);
            color: var(--write-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }
        
        button {
            background-color: var(--border);
            color: var(--text-main);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #475569;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Memtrace Visualizer</h1>
            <div class="controls">
                <button onclick="loadData()">Reload Data</button>
            </div>
        </header>

        <div id="error-message"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Accesses</h3>
                <div class="value" id="stat-total">-</div>
            </div>
            <div class="stat-card">
                <h3>Reads</h3>
                <div class="value" id="stat-reads" style="color: var(--read-color)">-</div>
            </div>
            <div class="stat-card">
                <h3>Writes</h3>
                <div class="value" id="stat-writes" style="color: var(--write-color)">-</div>
            </div>
            <div class="stat-card">
                <h3>Unique Addresses</h3>
                <div class="value" id="stat-unique">-</div>
            </div>
        </div>

        <div class="visualization-container">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Access Timeline</div>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-color read-color"></div>
                            <span>Read</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color write-color"></div>
                            <span>Write</span>
                        </div>
                    </div>
                </div>
                <div style="position: relative;">
                    <canvas id="timeline-canvas"></canvas>
                    <div id="timeline-tooltip" class="tooltip"></div>
                </div>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 1rem; text-align: center;">
                    X-axis: Time (access index) &nbsp;|&nbsp; Y-axis: Memory Address
                </p>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Cache Line Heatmap (64B)</div>
                </div>
                <div style="position: relative;">
                    <canvas id="heatmap-canvas"></canvas>
                    <div id="heatmap-tooltip" class="tooltip"></div>
                </div>
                <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 1rem; text-align: center;">
                    Shows access frequency by cache line. Blue = Cold, Red = Hot
                </p>
            </div>
        </div>
    </div>

    <script>
        let traceData = [];
        
        async function loadData() {
            const timelineCanvas = document.getElementById('timeline-canvas');
            const heatmapCanvas = document.getElementById('heatmap-canvas');
            const ctxTimeline = timelineCanvas.getContext('2d');
            const ctxHeatmap = heatmapCanvas.getContext('2d');
            const errorEl = document.getElementById('error-message');
            
            ctxTimeline.clearRect(0, 0, timelineCanvas.width, timelineCanvas.height);
            ctxHeatmap.clearRect(0, 0, heatmapCanvas.width, heatmapCanvas.height);
            
            errorEl.style.display = 'none';

            try {
                const response = await fetch('memtrace.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                traceData = await response.json();
                
                if (!Array.isArray(traceData) || traceData.length === 0) {
                    throw new Error("No trace data found or invalid format.");
                }
                
                updateStats(traceData);
                drawTimeline(traceData);
                drawHeatmap(traceData);
                
            } catch (error) {
                console.error("Failed to load trace data:", error);
                errorEl.textContent = `Failed to load memtrace.json: ${error.message}. Please run the application to generate the data, then serve this folder using a local web server (e.g., 'python3 -m http.server').`;
                errorEl.style.display = 'block';
                
                // Demo data fallback for illustration if fetch fails
                console.log("Generating demo data instead...");
                generateDemoData();
            }
        }
        
        function updateStats(data) {
            document.getElementById('stat-total').textContent = data.length.toLocaleString();
            
            const reads = data.filter(d => d.type === 0).length;
            const writes = data.length - reads;
            
            document.getElementById('stat-reads').textContent = reads.toLocaleString();
            document.getElementById('stat-writes').textContent = writes.toLocaleString();
            
            const unique = new Set(data.map(d => d.addr)).size;
            document.getElementById('stat-unique').textContent = unique.toLocaleString();
        }
        
        function resizeCanvas(canvas) {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 400; // Fixed height
        }
        
        function drawTimeline(data) {
            const canvas = document.getElementById('timeline-canvas');
            resizeCanvas(canvas);
            const ctx = canvas.getContext('2d');
            
            if (data.length === 0) return;
            
            const minAddr = Math.min(...data.map(d => d.addr));
            const maxAddr = Math.max(...data.map(d => d.addr));
            const addrRange = Math.max(1, maxAddr - minAddr);
            
            const width = canvas.width;
            const height = canvas.height;
            
            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Draw grid
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = i * (height / 5);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // Draw points
            const pointSize = data.length > 5000 ? 1 : 2;
            
            data.forEach((entry, i) => {
                const x = (i / data.length) * width;
                const y = height - ((entry.addr - minAddr) / addrRange) * height;
                
                ctx.fillStyle = entry.type === 0 ? '#4ade80' : '#f87171'; // Read : Write
                
                ctx.globalAlpha = data.length > 10000 ? 0.3 : 0.8;
                ctx.fillRect(x, y - pointSize/2, pointSize, pointSize);
            });
            ctx.globalAlpha = 1.0;
            
            // Interactive tooltip logic
            setupTimelineTooltip(canvas, data, minAddr, maxAddr, addrRange);
        }
        
        function setupTimelineTooltip(canvas, data, minAddr, maxAddr, addrRange) {
            const tooltip = document.getElementById('timeline-tooltip');
            
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                
                const index = Math.floor((x / canvas.width) * data.length);
                
                if (index >= 0 && index < data.length) {
                    const entry = data[index];
                    
                    tooltip.innerHTML = `
                        <div class="tooltip-row">
                            <span class="tooltip-label">Access #:</span>
                            <span class="tooltip-value">${index}</span>
                        </div>
                        <div class="tooltip-row">
                            <span class="tooltip-label">Address:</span>
                            <span class="tooltip-value">0x${entry.addr.toString(16)}</span>
                        </div>
                        <div class="tooltip-row">
                            <span class="tooltip-label">Size:</span>
                            <span class="tooltip-value">${entry.size} bytes</span>
                        </div>
                        <div class="tooltip-row">
                            <span class="tooltip-label">Type:</span>
                            <span class="tooltip-value" style="color: ${entry.type === 0 ? 'var(--read-color)' : 'var(--write-color)'}">${entry.type === 0 ? 'READ' : 'WRITE'}</span>
                        </div>
                    `;
                    
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY + 15) + 'px';
                    tooltip.style.opacity = '1';
                }
            };
            
            canvas.onmouseleave = () => {
                tooltip.style.opacity = '0';
            };
        }
        
        function drawHeatmap(data) {
            const canvas = document.getElementById('heatmap-canvas');
            resizeCanvas(canvas);
            const ctx = canvas.getContext('2d');
            
            if (data.length === 0) return;
            
            // Group by cacheline (assume 64B)
            const CACHE_LINE_SIZE = 64;
            const cacheLines = new Map();
            
            data.forEach(entry => {
                const lineAddr = Math.floor(entry.addr / CACHE_LINE_SIZE) * CACHE_LINE_SIZE;
                cacheLines.set(lineAddr, (cacheLines.get(lineAddr) || 0) + 1);
            });
            
            const uniqueLines = Array.from(cacheLines.keys()).sort((a, b) => a - b);
            
            if (uniqueLines.length === 0) return;
            
            const maxAccesses = Math.max(...Array.from(cacheLines.values()));
            
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.clearRect(0, 0, width, height);
            
            // We'll draw this as a 2D grid if possible, or a 1D bar chart if sparse
            // For a heatmap, let's arrange cachelines in a grid
            const cols = Math.ceil(Math.sqrt(uniqueLines.length * (width/height)));
            const rows = Math.ceil(uniqueLines.length / cols);
            
            const cellW = width / cols;
            const cellH = height / rows;
            
            // Heatmap color helper (blue -> green -> yellow -> red)
            function getHeatColor(val, max) {
                const ratio = val / max;
                const hue = (1.0 - ratio) * 240; // 240 is blue, 0 is red
                return \`hsl(\${hue}, 100%, 50%)\`;
            }
            
            uniqueLines.forEach((lineAddr, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                
                const val = cacheLines.get(lineAddr);
                
                ctx.fillStyle = getHeatColor(val, maxAccesses);
                ctx.fillRect(col * cellW, row * cellH, cellW - 1, cellH - 1);
            });
            
            // Tooltip for heatmap
            const tooltip = document.getElementById('heatmap-tooltip');
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const col = Math.floor(x / cellW);
                const row = Math.floor(y / cellH);
                const idx = row * cols + col;
                
                if (idx >= 0 && idx < uniqueLines.length) {
                    const lineAddr = uniqueLines[idx];
                    const count = cacheLines.get(lineAddr);
                    
                    tooltip.innerHTML = `
                        <div class="tooltip-row">
                            <span class="tooltip-label">Cache Line:</span>
                            <span class="tooltip-value">0x\${lineAddr.toString(16)}</span>
                        </div>
                        <div class="tooltip-row">
                            <span class="tooltip-label">Accesses:</span>
                            <span class="tooltip-value">\${count}</span>
                        </div>
                        <div class="tooltip-row">
                            <span class="tooltip-label">Intensity:</span>
                            <span class="tooltip-value">\${Math.round((count/maxAccesses)*100)}%</span>
                        </div>
                    `;
                    
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY + 15) + 'px';
                    tooltip.style.opacity = '1';
                } else {
                    tooltip.style.opacity = '0';
                }
            };
            
            canvas.onmouseleave = () => {
                tooltip.style.opacity = '0';
            };
        }
        
        function generateDemoData() {
            // Generate some nice looking demo data with sequential and random patterns
            const demoData = [];
            let currentAddr = 0x100000;
            
            // Sequential phase (read)
            for(let i=0; i<1000; i++) {
                demoData.push({ addr: currentAddr, size: 4, type: 0 });
                currentAddr += 4;
            }
            
            // Stride phase (write)
            currentAddr = 0x200000;
            for(let i=0; i<500; i++) {
                demoData.push({ addr: currentAddr, size: 8, type: 1 });
                currentAddr += 64;
            }
            
            // Random phase (mixed)
            for(let i=0; i<1000; i++) {
                const offset = Math.floor(Math.random() * 0x10000);
                demoData.push({ 
                    addr: 0x300000 + offset, 
                    size: 4, 
                    type: Math.random() > 0.7 ? 1 : 0 
                });
            }
            
            traceData = demoData;
            updateStats(traceData);
            drawTimeline(traceData);
            drawHeatmap(traceData);
        }

        // Initial setup
        window.addEventListener('resize', () => {
            if (traceData.length > 0) {
                drawTimeline(traceData);
                drawHeatmap(traceData);
            }
        });
        
        loadData();
    </script>
</body>
</html>
